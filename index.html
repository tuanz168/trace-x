*{box-sizing:border-box}
.wrap{max-width:640px;margin:0 auto;padding:26px 20px 40px}
.hd{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid #eaeef2}

.guide{display:none;margin-top:22px}
.guide.show{display:block}
.guide .act{width:100%;min-height:50px;border:0;border-radius:11px;background:#1677ff;color:#fff;font-size:16px;font-weight:600;font-family:inherit;box-shadow:0 6px 16px rgba(22,119,255,.24);-webkit-tap-highlight-color:transparent}

.guide .act.done{background:#18a058;box-shadow:0 6px 16px rgba(24,160,88,.24)}
.corner{position:fixed;top:0;right:0;width:200px;padding:10px 14px 20px 0;text-align:right;pointer-events:none;z-index:9}
.corner svg{display:block;margin-left:auto;width:58px;height:58px;color:#1677ff;transform-origin:60% 40%;animation:pt 1.5s ease-in-out infinite}
.corner em{display:inline-block;margin-top:6px;padding:5px 10px;background:rgba(22,119,255,.1);border:1px solid rgba(22,119,255,.22);border-radius:7px;color:#1677ff;font-size:12px;font-style:normal;font-weight:600;line-height:1.4}
@keyframes pt{0%,100%{transform:translate(4px,6px)}50%{transform:translate(-8px,-10px)}}
